# Conda environment for ULTRA on Isaac Sim 5.1.0 (Python 3.11, PyTorch 2.7.0 + CUDA 12.8).
#   conda env create -f environment.yml
#   conda activate ultra-isaacsim
# Then install Isaac Lab 2.3.2 from a git checkout (see docs/install.md):
#   pip install -e <IsaacLab>/source/isaaclab -c scripts/isaacsim_constraints.txt
# scripts/setup_isaacsim_env.sh performs all of these steps.
name: ultra-isaacsim
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - --extra-index-url https://pypi.nvidia.com
      - torch==2.7.0+cu128
      - torchvision==0.22.0+cu128
      - isaacsim[all,extscache]==5.1.0
      - -r requirements.txt
      - -c scripts/isaacsim_constraints.txt
